[motion]
; The addon owns controller-absolute weapon pose in proxy mode. The native
; runtime publishes the calibrated transform but does not inject mouse aim.
mode=AbsoluteWeapon

; Keep the world horizon stable when the HMD rolls. Set to 0 only to compare
; against the v17 head-locked projection behavior during troubleshooting.
roll_stabilization=1

; Tag each captured Arma frame with the orientation that rendered it so OpenXR
; can compensate motion between capture and display. Set to 0 for the legacy
; head-locked presentation during an A/B test.
captured_pose_reprojection=1

; Closed-loop correction from the tracked aim source to Arma's real weapon.
servo_counts_per_radian=2100
servo_gain=0.42
servo_max_counts=160

; Controller grip calibration remains neutral for the native weapon servo.
grip_x=0.0
grip_y=0.0
grip_z=0.0
grip_yaw_deg=0.0
grip_pitch_deg=0.0
grip_roll_deg=0.0

muzzle_x=0.0
muzzle_y=0.0
muzzle_z=-0.55
