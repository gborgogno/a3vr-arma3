name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-current -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build-current --config Release
      - name: Test
        run: ctest --test-dir build-current -C Release --output-on-failure
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $cmake = Get-Content -Raw CMakeLists.txt
          if ($cmake -notmatch 'project\(A3VR VERSION ([0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read A3VR version from CMakeLists.txt.'
          }
          $expectedTag = "v$($Matches[1])"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $expectedTag."
          }
      - name: Checkout pinned PBO packer
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@v4
        with:
          repository: 4d4a5852/a3lib.py
          ref: 0d89b71a0b8453aba02ffd43edb6a6ee4e78b335
          path: .ci/a3lib
      - name: Package installable mod
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: >-
          ./scripts/package-release.ps1
          -Configuration Release
          -BuildDirectory build-current
          -A3LibScript .ci/a3lib/a3lib.py
          -OutputDirectory release
      - name: Upload packaged artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: A3VR-Hybrid-${{ github.ref_name }}
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem -LiteralPath release -File |
            Where-Object { $_.Extension -eq '.zip' -or $_.Extension -eq '.sha256' } |
            ForEach-Object { $_.FullName }
          if ($assets.Count -ne 2) {
            throw "Expected ZIP and SHA-256 assets, found $($assets.Count)."
          }
          gh release create $env:GITHUB_REF_NAME @assets `
            --verify-tag `
            --title "A3VR $env:GITHUB_REF_NAME" `
            --generate-notes
